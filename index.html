<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Рутокен Био — Демонстрация биометрической аутентификации</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ===== TOP BAR ===== -->
  <header class="topbar">
    <div class="topbar-brand">🔐 Рутокен Био — Демо</div>
    <div class="topbar-status" id="connectionStatus">Плагин не загружен</div>
  </header>

  <!-- ===== БИО КНОПКИ (правый верхний угол) ===== -->
  <div class="bio-buttons-top-right">
    <button id="btnLoginBio" class="bio-btn small">Войти по биометрии</button>
    <button id="btnLogoutBio" class="bio-btn small">Выйти по биометрии</button>
    <button id="btnStopLoginBio" class="bio-btn small">Остановить проверку био</button>
  </div>

  <!-- ===== ОСНОВНОЙ ИНТЕРФЕЙС ===== -->
  <div class="app-container">

    <!-- ===== ПАНЕЛЬ УСТРОЙСТВ ===== -->
    <section class="panel devices-panel">
      <h2>📱 Устройства</h2>
      <label for="deviceList">Подключённые токены:</label>
      <select id="deviceList" size="5"></select>
      <button id="btnRefreshDevices" class="action-btn">↻ Обновить</button>
    </section>

    <!-- ===== ПАНЕЛЬ PIN ===== -->
    <section class="panel pin-panel">
      <h2>🔑 Вход на токен</h2>
      <label for="pinInput">PIN-код:</label>
      <input type="password" id="pinInput" value="12345678" />
      <button id="btnLogin" class="action-btn">Войти</button>
      <button id="btnLogout" class="action-btn">Выйти</button>
    </section>

    <!-- ===== ПАНЕЛЬ КЛЮЧЕЙ ===== -->
    <section class="panel keys-panel">
      <h2>🗝️ Ключевые пары</h2>
      <label for="keyList">Ключи на устройстве:</label>
      <select id="keyList" size="8"></select>
      <button id="btnRefreshKeys" class="action-btn">↻ Обновить</button>
      <button id="btnDeleteKey" class="action-btn danger">Удалить</button>
    </section>

    <!-- ===== ПАНЕЛЬ СОЗДАНИЯ КЛЮЧА ===== -->
    <section class="panel create-key-panel">
      <h2>➕ Создать ключевую пару</h2>
      <div class="form-row">
        <label>Алгоритм:</label>
        <select id="keyAlgorithm">
          <option value="PUBLIC_KEY_ALGORITHM_GOST3410_2001">ГОСТ Р 34.10-2001</option>
          <option value="PUBLIC_KEY_ALGORITHM_GOST3410_2012_256" selected>ГОСТ Р 34.10-2012 256</option>
          <option value="PUBLIC_KEY_ALGORITHM_GOST3410_2012_512">ГОСТ Р 34.10-2012 512</option>
        </select>
      </div>
      <div class="form-row">
        <label>Маркер:</label>
        <input type="text" id="keyMarker" placeholder="например TestKey" />
      </div>
      <div class="form-row">
        <label class="checkbox-label">
          <input type="checkbox" id="useBio" />
          🔬 С биометрией (защита отпечатком)
        </label>
      </div>
      <button id="btnCreateKey" class="action-btn primary">Создать пару</button>
    </section>

    <!-- ===== ПАНЕЛЬ ПОДПИСИ ===== -->
    <section class="panel sign-panel">
      <h2>✍️ Подпись данных</h2>
      <label for="signData">Данные для подписи (base64):</label>
      <textarea id="signData" rows="3" placeholder="Введите данные..."></textarea>
      <button id="btnSign" class="action-btn primary">Подписать</button>
      <div id="signResult" class="result-box" style="display:none;">
        <label>Результат подписи:</label>
        <textarea id="signResultText" rows="4" readonly></textarea>
      </div>
    </section>

    <!-- ===== КОНСОЛЬ ===== -->
    <section class="panel console-panel">
      <h2>📋 Лог операций</h2>
      <div id="console" class="console-output"></div>
      <button id="btnClearConsole" class="action-btn">Очистить</button>
    </section>

  </div>

  <!-- ===== БИОМЕТРИЧЕСКИЙ ПОПАП ===== -->
  <div id="bioPopup" class="bio-popup" style="display:none;">
    <div class="bio-popup-content">
      <h2>🔬 Коснитесь биометрического датчика</h2>
      <div class="bio-popup-scanner">
        <svg viewBox="0 0 100 100" width="120" height="120">
          <path d="M50 20c-12 0-20 8-20 20 0 3 1 5 1 7 0 8-3 14-3 22 0 2 1 4 2 6" 
                stroke="#00d4ff" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M50 20c12 0 20 8 20 20 0 3-1 5-1 7 0 8 3 14 3 22" 
                stroke="#00d4ff" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M50 30c-6 0-10 4-10 10 0 5 1 8 1 14 0 5-1 8-1 12" 
                stroke="#00d4ff" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M50 30c6 0 10 4 10 10 0 5-1 8-1 14 0 3 1 5 1 10" 
                stroke="#00d4ff" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M50 40v20" stroke="#00d4ff" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M44 48c0 5 1 8 6 8s6-3 6-8" stroke="#00d4ff" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M40 56c0 8 4 14 10 14s10-6 10-14" stroke="#00d4ff" stroke-width="2" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <p class="bio-popup-hint">Приложите палец к сканеру...</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
